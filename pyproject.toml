# Project tooling configuration.
#
# The pytest section below puts `src/` (for `import app...`) and the repo root
# (for `import simulator...`) on the import path, so tests run without installing
# the package, and points pytest at the `tests/` folder.
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v"
